name: VISION build and verify
on: [push, pull_request, workflow_dispatch]

jobs:
  server-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-control.txt
      - run: bash ./verify_release.sh

  android-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android-client assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vision-vpn-android-debug
          path: android-client/app/build/outputs/apk/debug/app-debug.apk

  android-control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android-admin assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vision-control-android-debug
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk

  ios-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios-client/project.yml
      - run: xcodebuild -project ios-client/VisionVPN.xcodeproj -scheme VisionVPN -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO build

  source-package:
    runs-on: ubuntu-24.04
    needs: [server-tests, android-client, android-control, ios-compile]
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path.cwd()
          out=root/'dist'
          out.mkdir(exist_ok=True)
          shutil.make_archive(str(out/'vision-vpn-suite-v1.0.0'),'zip',root_dir=root)
          PY
          sha256sum dist/vision-vpn-suite-v1.0.0.zip > dist/vision-vpn-suite-v1.0.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vision-vpn-suite-v1.0.0-source
          path: |
            dist/vision-vpn-suite-v1.0.0.zip
            dist/vision-vpn-suite-v1.0.0.sha256
